name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet --info
      - name: 01-unions
        run: dotnet run --project 01-unions
      - name: 02-closed-classes
        run: dotnet run --project 02-closed-classes
      - name: 04-runtime-async
        run: dotnet run --project 04-runtime-async

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: 03-winforms-visual-styles
        run: dotnet build 03-winforms-visual-styles
      - name: 05-maui-xaml-csharp-expressions (Windows target only)
        run: dotnet build 05-maui-xaml-csharp-expressions -p:TargetFrameworks=net11.0-windows10.0.19041.0
